<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070707">
  <title>GenLayer Studio — Loading Experience</title>

  <style>
    :root {
      --cobalt: #110fff;
      --lavender: #bca2ff;
      --void: #070707;
      --white: #ffffff;
      --green: #00ff66;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, 0.1);
      --bg: #070707;
      --surface: #101010;
      --surface-2: #151515;
      --ink: #ffffff;
      --soft: rgba(255, 255, 255, 0.045);
      --hover: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      overflow-x: hidden;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--lavender);
      outline-offset: 3px;
    }

    /* ===== Initial full-screen Loader ===== */

    #portal-loader {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--void);
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    #portal-loader.is-hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .loader-glow {
      position: absolute;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(17, 15, 255, 0.2), rgba(188, 162, 255, 0.07) 38%, transparent 72%);
      pointer-events: none;
    }

    .loader-brand {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--white);
      font-size: 14px;
      font-weight: 700;
    }

    .loader-brand svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .loader-content {
      position: relative;
      z-index: 1;
      width: min(370px, calc(100% - 44px));
      text-align: center;
    }

    .assembly-spinner {
      width: 94px;
      height: 90px;
      margin: 0 auto 27px;
      filter: drop-shadow(0 0 16px rgba(17, 15, 255, 0.4));
    }

    .assembly-spinner svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .mark-part {
      fill: url(#loader-gradient);
      transform-box: fill-box;
      transform-origin: center;
    }

    .mark-left {
      animation: loader-left 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    .mark-right {
      animation: loader-right 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    .mark-core {
      animation: loader-core 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    @keyframes loader-left {
      0%, 25%, 100% {
        opacity: 0.18;
        transform: translate(-15px, 8px) rotate(-14deg);
      }

      52%, 72% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg);
      }
    }

    @keyframes loader-right {
      0%, 25%, 100% {
        opacity: 0.18;
        transform: translate(15px, 8px) rotate(14deg);
      }

      52%, 72% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg);
      }
    }

    @keyframes loader-core {
      0%, 30%, 100% {
        opacity: 0.16;
        transform: translate(0, -12px) scale(0.68);
      }

      55%, 72% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }

    .loader-kicker {
      margin-bottom: 9px;
      color: var(--lavender);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .loader-title {
      min-height: 39px;
      margin-bottom: 9px;
      color: var(--white);
      font-size: 31px;
      font-weight: 650;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .loader-detail {
      min-height: 44px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .loader-progress {
      width: 100%;
      height: 3px;
      margin-top: 27px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    .loader-progress span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cobalt), var(--lavender));
      transition: width 0.45s ease;
    }

    .loader-footer {
      position: absolute;
      bottom: 23px;
      color: #747474;
      font-size: 11px;
    }

    /* ===== Revealed dummy GenLayer Studio ===== */

    #studio-app {
      display: none;
      min-height: 100vh;
      background: var(--bg);
    }

    #studio-app.is-visible {
      display: block;
      animation: page-in 0.5s ease both;
    }

    @keyframes page-in {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .topnav {
      display: flex;
      min-height: 64px;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .brand svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
    }

    .brand small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .nav-links {
      display: flex;
      gap: 6px;
    }

    .nav-links a {
      padding: 8px 11px;
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
    }

    .nav-links a.active,
    .nav-links a:hover {
      background: var(--hover);
      color: var(--ink);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .theme-button,
    .wallet-button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      color: var(--ink);
    }

    .theme-button {
      display: grid;
      width: 34px;
      padding: 0;
      place-items: center;
    }

    .theme-button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .wallet-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 650;
    }

    .wallet-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .content {
      width: min(1100px, calc(100% - 48px));
      margin: 0 auto;
      padding: 46px 0 70px;
    }

    .heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--lavender);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .heading h1 {
      font-size: clamp(32px, 5vw, 51px);
      font-weight: 650;
      letter-spacing: -0.065em;
      line-height: 0.95;
    }

    .heading p:last-child {
      max-width: 510px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .primary-button {
      min-height: 42px;
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      background: var(--cobalt);
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      margin-bottom: 13px;
    }

    .stat-card,
    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }

    .stat-card {
      min-height: 140px;
      padding: 18px;
    }

    .stat-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .stat-card-top span {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-icon {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 9px;
      background: rgba(17, 15, 255, 0.16);
      color: var(--lavender);
    }

    .metric-icon.green {
      background: rgba(0, 255, 102, 0.12);
      color: var(--green);
    }

    .metric-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .stat-card strong {
      display: block;
      margin-bottom: 5px;
      font-size: 28px;
      letter-spacing: -0.05em;
    }

    .stat-card small {
      color: var(--muted);
      font-size: 11px;
    }

    .stat-card small b {
      color: var(--green);
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(290px, 0.82fr);
      gap: 13px;
    }

    .panel {
      padding: 20px;
    }

    .panel-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .panel-heading h2 {
      margin-top: 5px;
      font-size: 19px;
      letter-spacing: -0.045em;
    }

    .panel-link {
      border: 0;
      background: transparent;
      color: var(--lavender);
      font-size: 11px;
      font-weight: 650;
    }

    .project-list {
      display: grid;
      gap: 9px;
    }

    .project {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-2);
    }

    .project-icon {
      display: grid;
      width: 33px;
      height: 33px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 9px;
      background: rgba(17, 15, 255, 0.16);
      color: var(--lavender);
    }

    .project-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .project-info {
      min-width: 0;
      flex: 1;
    }

    .project-info strong {
      display: block;
      margin-bottom: 3px;
      overflow: hidden;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-info span {
      color: var(--muted);
      font-size: 10px;
    }

    .live-state {
      color: var(--green);
      font-size: 10px;
      font-weight: 650;
    }

    .request-panel {
      display: flex;
      min-height: 340px;
      flex-direction: column;
    }

    .request-description {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .request-preview {
      display: grid;
      gap: 6px;
      margin-bottom: 15px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-2);
    }

    .request-preview span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .request-preview strong {
      font-size: 13px;
    }

    .run-button {
      display: inline-flex;
      min-height: 45px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 10px;
      background: var(--cobalt);
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
    }

    .run-button-loading {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .run-button.is-loading .run-label {
      display: none;
    }

    .run-button.is-loading .run-button-loading {
      display: inline-flex;
    }

    .run-button.is-success {
      background: #078a45;
    }

    .button-spinner {
      width: 17px;
      height: 16px;
      color: var(--white);
    }

    .button-spinner svg {
      width: 100%;
      height: 100%;
    }

    .button-part {
      fill: currentColor;
      transform-box: fill-box;
      transform-origin: center;
    }

    .button-left {
      animation: compact-build 1.2s linear infinite;
    }

    .button-right {
      animation: compact-build 1.2s linear 0.16s infinite;
    }

    .button-core {
      animation: compact-build 1.2s linear 0.32s infinite;
    }

    @keyframes compact-build {
      0%, 15% { opacity: 0.16; }
      30%, 58% { opacity: 1; }
      78%, 100% { opacity: 0.16; }
    }

    .request-status {
      min-height: 17px;
      margin-top: 11px;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }

    .request-status.success {
      color: var(--green);
    }

    .network-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .network-meta span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 9px;
    }

    .network-meta strong {
      font-size: 11px;
    }

    .activity-panel {
      grid-column: 1 / -1;
    }

    .activity-list {
      border-top: 1px solid var(--line);
    }

    .activity-row {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      min-height: 57px;
      border-bottom: 1px solid var(--line);
    }

    .activity-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    .activity-dot.pending {
      background: var(--lavender);
    }

    .activity-copy strong,
    .activity-copy span {
      display: block;
    }

    .activity-copy strong {
      margin-bottom: 3px;
      font-size: 11px;
    }

    .activity-copy span,
    .activity-row time {
      color: var(--muted);
      font-size: 10px;
    }

    .activity-row time {
      white-space: nowrap;
    }

    .activity-row.new-row {
      animation: row-in 0.4s ease both;
    }

    @keyframes row-in {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .replay-button {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-2);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.28);
      color: var(--ink);
      font-size: 12px;
      font-weight: 650;
    }

    .replay-button svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    /* ===== Light theme ===== */

    body.theme-light {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface-2: #fafafa;
      --ink: #070707;
      --muted: #62626a;
      --line: rgba(7, 7, 7, 0.12);
      --hover: rgba(7, 7, 7, 0.06);
      --soft: rgba(7, 7, 7, 0.04);
    }

    /* ===== Mobile ===== */

    @media (max-width: 760px) {
      .loader-brand {
        top: 20px;
        left: 20px;
      }

      .loader-footer {
        bottom: 20px;
      }

      .topnav {
        min-height: 61px;
        padding: 0 16px;
      }

      .nav-links {
        display: none;
      }

      .wallet-button {
        max-width: 112px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .content {
        width: min(100% - 32px, 1100px);
        padding: 30px 0 48px;
      }

      .heading {
        display: grid;
        gap: 17px;
        align-items: start;
      }

      .heading h1 {
        font-size: 35px;
      }

      .heading .primary-button {
        width: 100%;
      }

      .stats-grid,
      .workspace-grid {
        grid-template-columns: 1fr;
      }

      .activity-panel {
        grid-column: auto;
      }

      .network-meta {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .activity-row {
        grid-template-columns: 8px minmax(0, 1fr);
        padding: 10px 0;
      }

      .activity-row time {
        grid-column: 2;
      }

      .replay-button {
        right: 14px;
        bottom: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <section id="portal-loader" aria-live="polite" aria-busy="true">
    <div class="loader-glow"></div>

    <div class="loader-brand">
      <svg viewBox="0 0 97.76 91.93" aria-hidden="true">
        <polygon points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
        <polygon points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
        <polygon points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92 48.64 43.78"/>
      </svg>
      <span>GenLayer</span>
    </div>

    <div class="loader-content">
      <div class="assembly-spinner" role="status" aria-label="Loading Portal">
        <svg viewBox="0 0 97.76 91.93" aria-hidden="true">
          <defs>
            <linearGradient id="loader-gradient" x1="0" y1="0" x2="97.76" y2="91.93" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#110fff"/>
              <stop offset="100%" stop-color="#bca2ff"/>
            </linearGradient>
          </defs>

          <polygon class="mark-part mark-left" points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
          <polygon class="mark-part mark-right" points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
          <polygon class="mark-part mark-core" points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92"/>
        </svg>
      </div>

      <p class="loader-kicker">GenLayer Studio</p>
      <h1 id="loader-title" class="loader-title">Loading Portal…</h1>
      <p id="loader-detail" class="loader-detail">
        Establishing a trusted connection to the network.
      </p>

      <div class="loader-progress" aria-hidden="true">
        <span id="loader-progress"></span>
      </div>
    </div>

    <p class="loader-footer">Trust infrastructure for the AI age.</p>
  </section>

  <main id="studio-app" aria-hidden="true">
    <nav class="topnav">
      <a class="brand" href="#">
        <svg viewBox="0 0 97.76 91.93" aria-hidden="true">
          <polygon points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
          <polygon points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
          <polygon points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92 48.64 43.78"/>
        </svg>
        <span>GenLayer</span>
        <small>Studio</small>
      </a>

      <div class="nav-links">
        <a class="active" href="#">Overview</a>
        <a href="#">Projects</a>
        <a href="#">Validators</a>
        <a href="#">Requests</a>
      </div>

      <div class="nav-actions">
        <button id="theme-toggle" class="theme-button" type="button" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <p
