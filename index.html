<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="GenLayer Consensus Spinner — a lightweight SVG and CSS loading animation."
  >

  <title>GenLayer Consensus Spinner</title>

  <link
    rel="stylesheet"
    href="genlayer-spinner.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #08070d;
      color: #ffffff;
    }

    .showcase {
      display: flex;
      gap: 40px;

      align-items: center;
      justify-content: center;

      padding: 32px;
    }

    .card {
      width: 260px;
      height: 260px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 24px;

      border: 1px solid rgba(255,255,255,.08);

      background: #100d18;
    }

    .card.light {
      background: #f7f5fb;
    }

    .spinner {
      width: 72px;
      height: 72px;
    }

    .spinner svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .label {
      position: absolute;

      margin-top: 190px;

      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;

      opacity: .45;
    }

    .sizes {
      position: absolute;

      margin-top: 320px;

      display: flex;
      align-items: center;
      gap: 24px;
    }

    .size {
      display: block;
    }

    .size-16 {
      width: 16px;
      height: 16px;
    }

    .size-20 {
      width: 20px;
      height: 20px;
    }

    .size-24 {
      width: 24px;
      height: 24px;
    }

    .size-32 {
      width: 32px;
      height: 32px;
    }

    .size-48 {
      width: 48px;
      height: 48px;
    }

    @media (max-width: 700px) {

      .showcase {
        gap: 16px;
        padding: 20px;
      }

      .card {
        width: 150px;
        height: 150px;
      }

      .spinner {
        width: 56px;
        height: 56px;
      }

      .label {
        margin-top: 115px;
      }

      .sizes {
        margin-top: 205px;
      }

    }

  </style>

</head>


<body>

  <main class="showcase">

    <!-- DARK -->
    <section class="card">

      <div class="spinner">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 64 64"
          aria-hidden="true"
        >

          <use
            href="genlayer-spinner.svg#"
          />

        </svg>

      </div>

      <span class="label">
        Dark
      </span>

    </section>


    <!-- LIGHT -->
    <section class="card light">

      <div class="spinner">

        <!-- Inline SVG loads the animation -->
        <iframe
          src="genlayer-spinner.svg"
          title="GenLayer spinner"
          style="
            width:100%;
            height:100%;
            border:0;
            display:block;
          "
        ></iframe>

      </div>

      <span class="label">
        Light
      </span>

    </section>


    <!-- SIZE TEST -->
    <div class="sizes">

      <img
        class="size size-16"
        src="genlayer-spinner.svg"
        alt=""
      >

      <img
        class="size size-20"
        src="genlayer-spinner.svg"
        alt=""
      >

      <img
        class="size size-24"
        src="genlayer-spinner.svg"
        alt=""
      >

      <img
        class="size size-32"
        src="genlayer-spinner.svg"
        alt=""
      >

      <img
        class="size size-48"
        src="genlayer-spinner.svg"
        alt=""
      >

    </div>

  </main>

</body>

</html>
