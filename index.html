<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070707">
  <meta
    name="description"
    content="GenLayer Portal loading experience — Consensus Assembly spinner."
  >
  <title>GenLayer Portal — Consensus Assembly</title>

  <style>
    :root {
      --cobalt: #110fff;
      --lavender: #bca2ff;
      --void: #070707;
      --ceramic: #f5f5f5;
      --white: #ffffff;
      --muted-dark: #a7a7a7;
      --dark-line: rgba(255, 255, 255, 0.1);
      --success: #00ff66;
      --page-bg: #070707;
      --page-ink: #ffffff;
      --page-muted: #a7a7a7;
      --page-line: rgba(255, 255, 255, 0.1);
      --page-surface: rgba(255, 255, 255, 0.035);
      --page-hover: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-width: 320px;
      background: var(--page-bg);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--page-bg);
      color: var(--page-ink);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        system-ui,
        sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--lavender);
      outline-offset: 3px;
    }

    /* ========================================
       Full-screen initial loading experience
       ======================================== */

    #loader {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: grid;
      overflow: hidden;
      place-items: center;
      background: var(--void);
      transition: opacity 0.56s ease, visibility 0.56s ease;
    }

    #loader::before {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 46px 46px;
      content: "";
      opacity: 0.36;
      mask-image: radial-gradient(circle at 50% 50%, black 0%, transparent 72%);
    }

    #loader::after {
      position: absolute;
      width: min(560px, 120vw);
      height: min(560px, 120vw);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(17, 15, 255, 0.2) 0%,
        rgba(188, 162, 255, 0.09) 36%,
        transparent 72%
      );
      content: "";
      filter: blur(10px);
      pointer-events: none;
    }

    #loader.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .loader-brand {
      position: absolute;
      top: 28px;
      left: 32px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--white);
      font-size: 15px;
      font-weight: 680;
      letter-spacing: -0.04em;
    }

    .loader-brand svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .loader-content {
      position: relative;
      z-index: 2;
      display: flex;
      width: min(420px, calc(100% - 48px));
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .assembly-spinner {
      position: relative;
      width: 112px;
      height: 106px;
      margin-bottom: 28px;
      filter: drop-shadow(0 0 18px rgba(17, 15, 255, 0.26));
    }

    .assembly-spinner svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .mark-base {
      fill: var(--lavender);
      opacity: 0.1;
    }

    .mark-part {
      fill: url(#assembly-gradient);
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform, opacity;
    }

    .mark-left {
      animation: consensus-left 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    .mark-right {
      animation: consensus-right 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    .mark-core {
      animation: consensus-core 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    /*
      The symbol pieces start dispersed, resolve to the official geometry,
      hold in consensus, then return to an identical start state.
    */
    @keyframes consensus-left {
      0%,
      22% {
        opacity: 0.16;
        transform: translate(-18px, 10px) rotate(-15deg);
      }

      49%,
      74% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg);
      }

      100% {
        opacity: 0.16;
        transform: translate(-18px, 10px) rotate(-15deg);
      }
    }

    @keyframes consensus-right {
      0%,
      22% {
        opacity: 0.16;
        transform: translate(18px, 10px) rotate(15deg);
      }

      49%,
      74% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg);
      }

      100% {
        opacity: 0.16;
        transform: translate(18px, 10px) rotate(15deg);
      }
    }

    @keyframes consensus-core {
      0%,
      28% {
        opacity: 0.12;
        transform: translate(0, -14px) scale(0.62);
      }

      53%,
      74% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }

      100% {
        opacity: 0.12;
        transform: translate(0, -14px) scale(0.62);
      }
    }

    /*
      A soft sheen only appears while the complete official mark is held.
      This adds a polished completion moment without becoming a generic ring.
    */
    .sheen-group {
      mask: url(#symbol-mask);
    }

    .sheen-bar {
      opacity: 0;
      animation: consensus-sheen 2.6s ease-in-out infinite;
    }

    @keyframes consensus-sheen {
      0%,
      50% {
        opacity: 0;
        transform: translateX(-130px);
      }

      58% {
        opacity: 0.75;
      }

      72% {
        opacity: 0.75;
        transform: translateX(130px);
      }

      82%,
      100% {
        opacity: 0;
        transform: translateX(130px);
      }
    }

    .loader-eyebrow {
      margin-bottom: 10px;
      color: var(--lavender);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .loader-title {
      min-height: 42px;
      margin-bottom: 10px;
      color: var(--white);
      font-size: clamp(30px, 7vw, 43px);
      font-weight: 620;
      letter-spacing: -0.065em;
      line-height: 1;
    }

    .loader-detail {
      min-height: 44px;
      max-width: 328px;
      color: var(--muted-dark);
      font-size: 14px;
      line-height: 1.5;
    }

    .loader-progress {
      width: 100%;
      height: 3px;
      margin-top: 31px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    .loader-progress span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cobalt), var(--lavender));
      box-shadow: 0 0 20px rgba(17, 15, 255, 0.85);
      transition: width 0.48s ease;
    }

    .loader-footer {
      position: absolute;
      bottom: 28px;
      z-index: 2;
      color: #777777;
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    /* ========================================
       Portal page revealed after load
       ======================================== */

    .app {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.56s ease;
    }

    .app.visible {
      opacity: 1;
    }

    .topnav {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid var(--page-line);
      background: color-mix(in srgb, var(--page-bg) 88%, transparent);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--page-ink);
      font-size: 16px;
      font-weight: 680;
      letter-spacing: -0.04em;
      text-decoration: none;
    }

    .brand svg {
      width: 23px;
      height: 23px;
      fill: currentColor;
    }

    .nav-links {
      display: flex;
      gap: 5px;
    }

    .nav-links a {
      padding: 8px 12px;
      border-radius: 8px;
      color: var(--page-muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: color 180ms ease, background 180ms ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: var(--page-hover);
      color: var(--page-ink);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-button {
      display: grid;
      width: 34px;
      height: 34px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--page-line);
      border-radius: 9px;
      background: transparent;
      color: var(--page-ink);
    }

    .theme-button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--cobalt);
      color: var(--white);
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 650;
      transition: filter 180ms ease, transform 180ms ease;
    }

    .btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-outline {
      border: 1px solid var(--page-line);
      border-radius: 999px;
      background: transparent;
      color: var(--page-ink);
      padding: 10px 19px;
      font-size: 13px;
      font-weight: 600;
      transition: background 180ms ease;
    }

    .btn-outline:hover {
      background: var(--page-hover);
    }

    .hero-section {
      position: relative;
      display: flex;
      min-height: 570px;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 80px 24px;
      text-align: center;
    }

    .hero-section::before {
      position: absolute;
      top: 42%;
      left: 50%;
      width: min(620px, 120vw);
      height: min(620px, 120vw);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(17, 15, 255, 0.19) 0%,
        rgba(188, 162, 255, 0.08) 35%,
        transparent 71%
      );
      content: "";
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .hero-mark {
      position: absolute;
      top: 55%;
      left: 50%;
      width: min(440px, 82vw);
      color: rgba(188, 162, 255, 0.08);
      fill: currentColor;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 27px;
      padding: 7px 13px;
      border: 1px solid var(--page-line);
      border-radius: 999px;
      background: var(--page-surface);
      color: var(--page-muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero-badge i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.76);
    }

    .hero-section h1 {
      max-width: 760px;
      margin-bottom: 18px;
      font-size: clamp(2.65rem, 7vw, 5.2rem);
      font-weight: 620;
      letter-spacing: -0.075em;
      line-height: 0.93;
    }

    .hero-section h1 span {
      background: linear-gradient(100deg, var(--cobalt), var(--lavender));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-section p {
      max-width: 540px;
      margin-bottom: 33px;
      color: var(--page-muted);
      font-size: clamp(15px, 2vw, 17px);
      line-height: 1.58;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 11px;
    }

    .compact-demo {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 26px;
      padding: 9px 11px;
      border: 1px solid var(--page-line);
      border-radius: 999px;
      background: var(--page-surface);
      color: var(--page-muted);
      font-size: 11px;
    }

    .compact-spinner {
      width: 18px;
      height: 18px;
      color: var(--cobalt);
    }

    .compact-spinner svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .compact-part {
      fill: currentColor;
      transform-box: fill-box;
      transform-origin: center;
    }

    .compact-left {
      animation: compact-build 1.35s linear infinite;
    }

    .compact-right {
      animation: compact-build 1.35s linear 0.18s infinite;
    }

    .compact-core {
      animation: compact-build 1.35s linear 0.36s infinite;
    }

    @keyframes compact-build {
      0%,
      16% {
        opacity: 0.18;
      }

      30%,
      58% {
        opacity: 1;
      }

      78%,
      100% {
        opacity: 0.18;
      }
    }

    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      border-top: 1px solid var(--page-line);
      background: var(--page-line);
    }

    .stat {
      padding: 27px 18px;
      background: var(--page-bg);
      text-align: center;
    }

    .stat .num {
      margin-bottom: 5px;
      font-size: clamp(23px, 3vw, 29px);
      font-weight: 620;
      letter-spacing: -0.055em;
    }

    .stat .lbl {
      color: var(--page-muted);
      font-size: 12px;
    }

    .replay-btn {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 15px;
      border: 1px solid var(--page-line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--page-bg) 88%, transparent);
      box-shadow: 0 7px 28px rgba(0, 0, 0, 0.28);
      color: var(--page-ink);
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(12px);
    }

    .replay-btn:hover {
      background: var(--page-hover);
    }

    .replay-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    /* ========================================
       Light page theme
       ======================================== */

    body.theme-light {
      --page-bg: #f5f5f5;
      --page-ink: #070707;
      --page-muted: #66666c;
      --page-line: rgba(7, 7, 7, 0.12);
      --page-surface: rgba(7, 7, 7, 0.03);
      --page-hover: rgba(7, 7, 7, 0.07);

      background: var(--page-bg);
    }

    body.theme-light .topnav {
      background: color-mix(in srgb, #f5f5f5 88%, transparent);
    }

    body.theme-light .hero-mark {
      color: rgba(17, 15, 255, 0.07);
    }

    body.theme-light .replay-btn {
      box-shadow: 0 7px 28px rgba(0, 0, 0, 0.11);
    }

    /* ========================================
       Mobile and motion accessibility
       ======================================== */

    @media (max-width: 760px) {
      .loader-brand {
        top: 22px;
        left: 22px;
      }

      .loader-footer {
        bottom: 22px;
      }

      .topnav {
        min-height: 62px;
        padding: 0 16px;
      }

      .nav-links {
        display: none;
      }

      .theme-button {
        width: 33px;
        height: 33px;
      }

      .btn {
        padding: 9px 14px;
        font-size: 12px;
      }

      .hero-section {
        min-height: 540px;
        padding: 72px 20px;
      }

      .stats-strip {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat {
        padding: 21px 14px;
      }

      .replay-btn {
        right: 16px;
        bottom: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }

      .mark-part,
      .sheen-bar,
      .compact-part {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }

      #loader,
      .app,
      .loader-progress span {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Full-screen real loading state -->
  <section
    id="loader"
    aria-live="polite"
    aria-busy="true"
    aria-label="Loading GenLayer Portal"
  >
    <div class="loader-brand" aria-label="GenLayer">
      <svg viewBox="0 0 97.76 91.93" aria-hidden="true">
        <polygon points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
        <polygon points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
        <polygon points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92 48.64 43.78"/>
      </svg>
      <span>GenLayer</span>
    </div>

    <div class="loader-content">
      <div class="assembly-spinner" role="status" aria-label="Loading Portal">
        <svg viewBox="0 0 97.76 91.93" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="assembly-gradient" x1="0" y1="0" x2="97.76" y2="91.93" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#110FFF"/>
              <stop offset="100%" stop-color="#BCA2FF"/>
            </linearGradient>

            <linearGradient id="sheen-gradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
              <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.86"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </linearGradient>

            <mask id="symbol-mask">
              <rect x="0" y="0" width="97.76" height="91.93" fill="#000000"/>
              <polygon points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35" fill="#FFFFFF"/>
              <polygon points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35" fill="#FFFFFF"/>
              <polygon points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92" fill="#FFFFFF"/>
            </mask>
          </defs>

          <!-- Faint resting geometry gives the dispersed stage a recognizable identity. -->
          <polygon class="mark-base" points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
          <polygon class="mark-base" points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
          <polygon class="mark-base" points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92"/>

          <!-- Exact official GenLayer symbol geometry, animated as three consensus parts. -->
          <polygon class="mark-part mark-left" points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
          <polygon class="mark-part mark-right" points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
          <polygon class="mark-part mark-core" points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92"/>

          <!-- Controlled light pass during the resolved consensus moment. -->
          <g class="sheen-group">
            <rect
              class="sheen-bar"
              x="-95"
              y="-4"
              width="96"
              height="102"
              fill="url(#sheen-gradient)"
              transform="skewX(-18)"
            />
          </g>
        </svg>
      </div>

      <p class="loader-eyebrow">GenLayer Portal</p>
      <h1 id="loader-title" class="loader-title">Initializing Portal</h1>
      <p id="loader-detail" class="loader-detail">
