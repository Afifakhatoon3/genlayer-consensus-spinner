<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GenLayer Consensus Spinner</title>

  <link rel="stylesheet" href="genlayer-spinner.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Inter, system-ui, sans-serif;

      background: #09070f;
      color: white;
    }

    .container {
      display: flex;
      gap: 64px;
      align-items: center;
      justify-content: center;
      padding: 48px;
    }

    .preview {
      width: 280px;
      height: 280px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 24px;

      background: #100d18;
      border: 1px solid #272031;
    }

    .preview.light {
      background: #f7f5fb;
    }

    .hero-spinner {
      width: 96px;
      height: 96px;
    }

    .hero-spinner img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sizes {
      position: absolute;
      margin-top: 180px;

      display: flex;
      align-items: center;
      gap: 24px;
    }

    .size {
      display: block;
      object-fit: contain;
    }

    .s16 {
      width: 16px;
      height: 16px;
    }

    .s20 {
      width: 20px;
      height: 20px;
    }

    .s24 {
      width: 24px;
      height: 24px;
    }

    .s32 {
      width: 32px;
      height: 32px;
    }

    .s48 {
      width: 48px;
      height: 48px;
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- DARK MODE -->
    <section class="preview">

      <div class="hero-spinner">
        <img
          src="genlayer-spinner.svg"
          alt="GenLayer loading spinner"
        />
      </div>

    </section>


    <!-- LIGHT MODE -->
    <section class="preview light">

      <div class="hero-spinner">
        <img
          src="genlayer-spinner.svg"
          alt="GenLayer loading spinner"
        />
      </div>

    </section>

  </main>

</body>
</html>
