<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 80 80"
  role="img"
  aria-labelledby="spinner-title spinner-description"
>
  <title id="spinner-title">GenLayer loading spinner</title>
  <desc id="spinner-description">
    A layered network spinner with three orbiting nodes.
  </desc>

  <defs>
    <linearGradient id="genlayer-gradient" x1="12" y1="12" x2="68" y2="68">
      <stop offset="0%" stop-color="#110fff" />
      <stop offset="100%" stop-color="#bca2ff" />
    </linearGradient>

    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .track {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.5;
      opacity: 0.14;
    }

    .ring {
      fill: none;
      stroke: #bca2ff;
      stroke-width: 1.2;
      stroke-opacity: 0.35;
      stroke-dasharray: 3 7;
      transform-origin: 40px 40px;
      animation: counter-spin 2.4s linear infinite;
    }

    .arc {
      fill: none;
      stroke: url(#genlayer-gradient);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 34 148;
      transform-origin: 40px 40px;
      animation: spin 1.05s linear infinite;
    }

    .nodes {
      fill: #bca2ff;
      transform-origin: 40px 40px;
      animation: orbit 1.8s linear infinite;
    }

    .core {
      transform-origin: 40px 40px;
      animation: pulse 1.05s ease-in-out infinite;
    }

    .core-outline {
      fill: none;
      stroke: #bca2ff;
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .core-fill {
      fill: url(#genlayer-gradient);
    }

    .core-line {
      fill: none;
      stroke: #ffffff;
      stroke-opacity: 0.3;
      stroke-width: 1.2;
      stroke-linecap: round;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes counter-spin {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes orbit {
      from {
        transform: rotate(0deg) translateY(-29px) rotate(0deg);
      }

      to {
        transform: rotate(360deg) translateY(-29px) rotate(-360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.94);
        opacity: 0.78;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .arc,
      .ring,
      .nodes,
      .core {
        animation: none;
      }
    }
  </style>

  <circle class="track" cx="40" cy="40" r="29" />
  <circle class="ring" cx="40" cy="40" r="29" />
  <circle class="arc" cx="40" cy="40" r="29" />

  <g class="nodes" filter="url(#node-glow)">
    <circle cx="40" cy="11" r="4" />
    <circle cx="65.1" cy="54.5" r="4" opacity="0.82" />
    <circle cx="14.9" cy="54.5" r="4" opacity="0.64" />
  </g>

  <g class="core">
    <path
      class="core-outline"
      d="M40 22 55 30.5v17L40 56 25 47.5v-17L40 22Z"
    />

    <path
      class="core-fill"
      d="M40 29 49 34v11l-9 5-9-5V34l9-5Z"
    />

    <path
      class="core-line"
      d="M40 29v21M31 34l9 5 9-5"
    />
  </g>
</svg>
