<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="GenLayer consensus loading spinner"
>
  <defs>
    <linearGradient id="gl" x1="8" y1="8" x2="56" y2="56">
      <stop offset="0%" stop-color="#C9B0FF"/>
      <stop offset="48%" stop-color="#9B6BFF"/>
      <stop offset="100%" stop-color="#6935FF"/>
    </linearGradient>

    <filter
      id="glow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="1.25"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle orbital track -->
  <circle
    cx="32"
    cy="32"
    r="22"
    fill="none"
    stroke="currentColor"
    stroke-width="1"
    opacity=".13"
  />

  <!-- Validator network -->
  <g
    class="validator-network"
    transform-origin="32px 32px"
    filter="url(#glow)"
  >

    <!-- Active orbital segment -->
    <circle
      cx="32"
      cy="32"
      r="22"
      fill="none"
      stroke="url(#gl)"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-dasharray="34 104"
    />

    <!-- Validator nodes -->
    <circle
      cx="32"
      cy="10"
      r="3.4"
      fill="#C9B0FF"
      class="validator validator-1"
    />

    <circle
      cx="51.05"
      cy="43"
      r="3.4"
      fill="#9B6BFF"
      class="validator validator-2"
    />

    <circle
      cx="12.95"
      cy="43"
      r="3.4"
      fill="#D8C7FF"
      class="validator validator-3"
    />

  </g>

  <!-- Consensus core -->
  <g
    class="consensus-core"
    transform-origin="32px 32px"
  >

    <!-- Outer GenLayer-inspired geometry -->
    <path
      d="
        M32 16.5
        L45 24
        V34.5
        L32 42
        L19 34.5
        V24
        Z
      "
      fill="none"
      stroke="url(#gl)"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <!-- Inner consensus mark -->
    <path
      d="
        M25.2 29.1
        L32 33
        L38.8 29.1
      "
      fill="none"
      stroke="currentColor"
      stroke-width="3.1"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lower layer -->
    <path
      d="
        M22.8 36.7
        L32 42
        L41.2 36.7
      "
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity=".7"
    />

  </g>

  <!-- Consensus pulse -->
  <circle
    class="consensus-pulse"
    cx="32"
    cy="32"
    r="13"
    fill="none"
    stroke="url(#gl)"
    stroke-width="1.5"
  />

  <style>

    /* -------------------------
       Validator rotation
    ------------------------- */

    .validator-network {
      animation:
        network-rotation
        1.8s
        cubic-bezier(.55,.05,.25,.95)
        infinite;
    }

    @keyframes network-rotation {

      0% {
        transform: rotate(0deg);
        opacity: .78;
      }

      45% {
        opacity: 1;
      }

      100% {
        transform: rotate(360deg);
        opacity: .78;
      }

    }


    /* -------------------------
       Validator activity
    ------------------------- */

    .validator {
      transform-origin: center;
      animation:
        validator-pulse
        1.8s
        ease-in-out
        infinite;
    }

    .validator-2 {
      animation-delay: -.6s;
    }

    .validator-3 {
      animation-delay: -1.2s;
    }

    @keyframes validator-pulse {

      0%,
      100% {
        transform: scale(.82);
        opacity: .7;
      }

      45%,
      60% {
        transform: scale(1.12);
        opacity: 1;
      }

    }


    /* -------------------------
       Consensus core
    ------------------------- */

    .consensus-core {
      animation:
        core-pulse
        1.8s
        cubic-bezier(.4,0,.2,1)
        infinite;
    }

    @keyframes core-pulse {

      0%,
      100% {
        transform: scale(.93);
        opacity: .86;
      }

      48%,
      60% {
        transform: scale(1);
        opacity: 1;
      }

    }


    /* -------------------------
       Consensus wave
    ------------------------- */

    .consensus-pulse {
      transform-origin: 32px 32px;
      animation:
        consensus-wave
        1.8s
        ease-out
        infinite;
      opacity: 0;
    }

    @keyframes consensus-wave {

      0% {
        transform: scale(.65);
        opacity: 0;
      }

      48% {
        opacity: .7;
      }

      75% {
        transform: scale(1.45);
        opacity: 0;
      }

      100% {
        transform: scale(1.45);
        opacity: 0;
      }

    }


    /* -------------------------
       Accessibility
    ------------------------- */

    @media (prefers-reduced-motion: reduce) {

      .validator-network,
      .validator,
      .consensus-core,
      .consensus-pulse {
        animation: none;
      }

    }

  </style>
</svg>
