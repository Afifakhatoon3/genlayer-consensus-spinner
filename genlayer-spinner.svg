<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     role="img"
     aria-label="GenLayer loading spinner">

  <defs>

    <linearGradient id="purple"
                    x1="8"
                    y1="8"
                    x2="56"
                    y2="56">

      <stop offset="0%" stop-color="#D8C7FF"/>
      <stop offset="45%" stop-color="#A875FF"/>
      <stop offset="100%" stop-color="#7138FF"/>

    </linearGradient>

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="1.2"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- Subtle orbit -->

  <circle
    cx="32"
    cy="32"
    r="22"
    fill="none"
    stroke="#9B6BFF"
    stroke-opacity=".18"
    stroke-width="1"/>


  <!-- Validator network -->

  <g
    class="network"
    transform-origin="32px 32px"
    filter="url(#glow)">

    <circle
      cx="32"
      cy="32"
      r="22"
      fill="none"
      stroke="url(#purple)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-dasharray="34 104"/>


    <!-- Validator 1 -->

    <circle
      cx="32"
      cy="10"
      r="3.5"
      fill="#D8C7FF"/>


    <!-- Validator 2 -->

    <circle
      cx="51.05"
      cy="43"
      r="3.5"
      fill="#A875FF"/>


    <!-- Validator 3 -->

    <circle
      cx="12.95"
      cy="43"
      r="3.5"
      fill="#C5A8FF"/>

  </g>


  <!-- GenLayer inspired core -->

  <g
    class="core"
    transform-origin="32px 32px">

    <!-- Main geometry -->

    <path
      d="M32 16.5
         L45 24
         V34.5
         L32 42
         L19 34.5
         V24
         Z"
      fill="none"
      stroke="url(#purple)"
      stroke-width="3.2"
      stroke-linejoin="round"/>


    <!-- Central consensus mark -->

    <path
      d="M25.2 29.2
         L32 33.1
         L38.8 29.2"
      fill="none"
      stroke="#C9B0FF"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"/>


    <!-- Lower layer -->

    <path
      d="M22.8 36.7
         L32 42
         L41.2 36.7"
      fill="none"
      stroke="#A875FF"
      stroke-width="2.1"
      stroke-linecap="round"
      stroke-linejoin="round"/>

  </g>


  <!-- Consensus pulse -->

  <circle
    class="pulse"
    cx="32"
    cy="32"
    r="13"
    fill="none"
    stroke="#A875FF"
    stroke-width="1.4"/>


  <style>

    /* Validator rotation */

    .network {
      animation:
        rotate
        1.8s
        cubic-bezier(.55,.05,.25,.95)
        infinite;
    }

    @keyframes rotate {

      0% {
        transform: rotate(0deg);
        opacity: .75;
      }

      45% {
        opacity: 1;
      }

      100% {
        transform: rotate(360deg);
        opacity: .75;
      }

    }


    /* Core pulse */

    .core {
      animation:
        corePulse
        1.8s
        cubic-bezier(.4,0,.2,1)
        infinite;
    }

    @keyframes corePulse {

      0%,
      100% {
        transform: scale(.93);
        opacity: .86;
      }

      48%,
      60% {
        transform: scale(1);
        opacity: 1;
      }

    }


    /* Consensus wave */

    .pulse {
      transform-origin: 32px 32px;

      animation:
        pulse
        1.8s
        ease-out
        infinite;

      opacity: 0;
    }

    @keyframes pulse {

      0% {
        transform: scale(.65);
        opacity: 0;
      }

      48% {
        opacity: .65;
      }

      75% {
        transform: scale(1.45);
        opacity: 0;
      }

      100% {
        transform: scale(1.45);
        opacity: 0;
      }

    }


    /* Accessibility */

    @media (prefers-reduced-motion: reduce) {

      .network,
      .core,
      .pulse {
        animation: none;
      }

    }

  </style>

</svg>
