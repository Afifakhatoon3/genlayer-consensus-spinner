      stroke="currentColor"
      stroke-width="3.1"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lower layer -->
    <path
      d="
        M22.8 36.7
        L32 42
        L41.2 36.7
      "
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity=".7"
    />

  </g>

  <!-- Consensus pulse -->
  <circle
    class="consensus-pulse"
    cx="32"
    cy="32"
    r="13"
    fill="none"
    stroke="url(#gl)"
    stroke-width="1.5"
  />

  <style>

    /* -------------------------
       Validator rotation
    ------------------------- */

    .validator-network {
      animation:
        network-rotation
        1.8s
        cubic-bezier(.55,.05,.25,.95)
        infinite;
    }

    @keyframes network-rotation {

      0% {
        transform: rotate(0deg);
        opacity: .78;
      }

      45% {
        opacity: 1;
      }

      100% {
        transform: rotate(360deg);
        opacity: .78;
      }

    }


    /* -------------------------
       Validator activity
    ------------------------- */

    .validator {
      transform-origin: center;
      animation:
        validator-pulse
        1.8s
        ease-in-out
        infinite;
    }

    .validator-2 {
      animation-delay: -.6s;
    }

    .validator-3 {
      animation-delay: -1.2s;
    }

    @keyframes validator-pulse {

      0%,
      100% {
        transform: scale(.82);
        opacity: .7;
      }

      45%,
      60% {
        transform: scale(1.12);
        opacity: 1;
      }

    }


    /* -------------------------
       Consensus core
    ------------------------- */

    .consensus-core {
      animation:
        core-pulse
        1.8s
        cubic-bezier(.4,0,.2,1)
        infinite;
    }

    @keyframes core-pulse {

      0%,
      100% {
        transform: scale(.93);
        opacity: .86;
      }

      48%,
      60% {
        transform: scale(1);
        opacity: 1;
      }

    }


    /* -------------------------
       Consensus wave
    ------------------------- */

    .consensus-pulse {
      transform-origin: 32px 32px;
      animation:
        consensus-wave
        1.8s
        ease-out
        infinite;
      opacity: 0;
    }

    @keyframes consensus-wave {

      0% {
        transform: scale(.65);
        opacity: 0;
      }

      48% {
        opacity: .7;
      }

      75% {
        transform: scale(1.45);
        opacity: 0;
      }

      100% {
        transform: scale(1.45);
        opacity: 0;
      }

    }


    /* -------------------------
       Accessibility
    ------------------------- */

    @media (prefers-reduced-motion: reduce) {

      .validator-network,
      .validator,
      .consensus-core,
      .consensus-pulse {
        animation: none;
      }

    }

  </style>
</svg>
